source = $HOME/.config/hypr/mocha.conf

$accent = $peach
$accentAlpha = $mauveAlpha
#$font = JetBrainsMono Nerd Font
$font = Lilex Nerd Font Light

# GENERAL
general {
  hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, .5, linear
    animation = fadeOut, 1, .5, linear
    animation = inputFieldDots, 0, 0, linear
}


auth {
  # see example from hyprlock docs
  fingerprint {
    enabled = true
    ready_message = Scan fingerprint to unlock
    present_message = Scanning...
    retry_delay = 250 # in milliseconds
  }
}

# BACKGROUND
background {
  monitor =
  #path = $HOME/pictures/wallpaper
  #path = screenshot
  #blur_passes = 3
  #blur_size = 10
  #color = $base
  color = rgb(000000)
  
}

# LAYOUT
#label {
#  monitor =
#  text = Layout: $LAYOUT
#  color = $text
#  font_size = 25
#  font_family = $font
#  position = 30, -30
#  halign = left
#  valign = top
#}

# TIME
label {
  monitor =
  text = $TIME
  #color = $text
  color = $accent
  font_size = 110
  font_family = $font
  position = 80, 60
  halign = left
  valign = bottom
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = 85, 30
  halign = left
  valign = bottom
}

# FINGERPRINT
{
  monitor = "";
  text = "$FPRINTPROMPT";
  color = "$text";
  font_size = 14;
  font_family = $font;
  position = "0, -107";
  halign = "center";
  valign = "center";
}

# USER AVATAR
#image {
#  monitor =
#  path = $HOME/.face
#  size = 100
#  border_color = $accent
#  border_size = 2
#  position = 0, 75
#  halign = center
#  valign = center
#}

# INPUT FIELD
input-field {
  monitor =
  size = 500, 50
  outline_thickness = 0
  rounding = 4

  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = false

  outer_color = rgba(00000000)  # $accent
  inner_color = rgba(00000000)  # $surface0
  padding = 0

  font_color = $text
  font_family = $font
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  text_align = left

  fade_on_empty = true
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, 47
  halign = center
  valign = bottom
}
